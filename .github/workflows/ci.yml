name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Windows runner: the crate calls Win32 APIs (DWM, WTS, registry).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Public evidence boundary
        run: |
          python scripts/check_public_docs.py --self-test
          python scripts/check_public_docs.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Development quality checks
        run: python scripts/test.py --layer quality

      - name: Ordinary unit suite in one isolated environment
        run: python scripts/unit_matrix.py --quick
