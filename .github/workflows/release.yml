name: Release

# A git tag alone does not show up on the Releases page — GitHub needs an
# explicit release object. Create one automatically for every `v*` tag, with
# the release binary attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Windows runner: the crate calls Win32 APIs (DWM, WTS, registry).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Full release unit tests
        run: cargo test --all --release

      - name: Build release binary
        run: cargo build --release

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/minicon-winmgr.exe \
             "dist/minicon-winmgr-${GITHUB_REF_NAME}-x86_64-windows.exe"
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Skip if the release already exists (e.g. created by hand).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; uploading assets only"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            notes="docs/releases/${GITHUB_REF_NAME}.md"
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" dist/* \
                --title "$GITHUB_REF_NAME" --notes-file "$notes" --latest
            else
              gh release create "$GITHUB_REF_NAME" dist/* \
                --title "$GITHUB_REF_NAME" --generate-notes --latest
            fi
          fi
