name: Release

# Tags produce a draft with immutable assets. Publish the exact tested artifact
# only after desktop/resource acceptance and review; a build is not acceptance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    # Windows runner: the crate calls Win32 APIs (DWM, WTS, registry).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Public evidence boundary
        run: |
          python scripts/check_public_docs.py --self-test
          python scripts/check_public_docs.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Full release unit tests
        run: cargo test --all --release

      - name: Promote the exact tested CI candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_artifact.py promote --manifest "docs/releases/${{ github.ref_name }}.artifact.toml" --download target/accepted-candidate --output dist --tag "${{ github.ref_name }}"

      - name: Stage draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "Refusing to replace assets of a published release"
              exit 1
            fi
            # No --clobber: do not silently replace an artifact under validation.
            gh release upload "$GITHUB_REF_NAME" dist/*
          else
            notes="docs/releases/${GITHUB_REF_NAME}.md"
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" dist/* \
                --title "$GITHUB_REF_NAME" --notes-file "$notes" --draft --verify-tag --latest=false
            else
              gh release create "$GITHUB_REF_NAME" dist/* \
                --title "$GITHUB_REF_NAME" --generate-notes --draft --verify-tag --latest=false
            fi
          fi
