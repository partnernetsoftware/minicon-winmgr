name: Release candidate
on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Language/concurrency change requires all four environments'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Public evidence boundary
        run: python scripts/check_public_docs.py
      - name: Quality and selected optimized unit suite
        run: |
          python scripts/test.py --layer quality
          if ('${{ inputs.full_matrix }}' -eq 'true') {
            python scripts/unit_matrix.py --release
          } else {
            python scripts/unit_matrix.py --release --quick
          }
      - name: Native menu shutdown regression
        run: |
          $menuFixture = @(Get-ChildItem target/release/deps/minicon_winmgr-*.exe | Where-Object {
            (& $_.FullName --list 2>$null) -match '^window::readiness_tests::native_close_ends_active_popup:'
          })
          if ($menuFixture.Count -ne 1) { throw 'Expected one native menu fixture binary' }
          python scripts/isolated_tray_probe.py --test-exe $menuFixture[0].FullName --test menu-close
      - name: Build optimized candidate
        run: cargo build --release --locked
      - name: Record portable build provenance
        run: python scripts/release_artifact.py prepare --exe target/release/minicon-winmgr.exe --tool target/release/minicon-tskmgr.exe --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 90
