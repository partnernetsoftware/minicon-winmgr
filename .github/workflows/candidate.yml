name: Release candidate
on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Language/concurrency change requires all four environments'
        type: boolean
        default: false
      access_validation:
        description: 'Role, account or authorization behavior changed'
        type: boolean
        default: false
      menu_regression:
        description: 'Native menu or shell shutdown behavior changed'
        type: boolean
        default: false
      tcp_observation:
        description: 'TCP counter collection or capability assessment changed'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Public evidence boundary
        run: python scripts/check_public_docs.py
      - name: Cross-account identity on disposable hosted runner (no UAC GUI)
        if: inputs.access_validation
        run: python scripts/cross_account_probe.py
      - name: Quality and selected optimized unit suite
        run: |
          python scripts/test.py --layer quality
          if ('${{ inputs.full_matrix }}' -eq 'true') {
            python scripts/unit_matrix.py --release
          } else {
            python scripts/unit_matrix.py --release --quick
          }
      - name: Native menu shutdown regression
        if: inputs.menu_regression
        run: python scripts/isolated_tray_probe.py --test-dir target/release/deps --test menu-close
      - name: Native administrator context with existing CI token (no UAC)
        if: inputs.access_validation
        run: cargo test --release --locked --lib task_access::tests::administrator_context_reads_all_tasks_without_widening_own_scope -- --ignored --exact --nocapture
      - name: Observe owned TCP counter capability (not process rate acceptance)
        if: inputs.tcp_observation
        run: python scripts/tcp_capability_probe.py
      - name: Build paired candidate and record bound provenance
        run: python scripts/build_candidate.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 90
