name: Documentation boundary
on:
  push:
    branches: [main]
    paths: ['docs/**', '**.md']
  pull_request:
    paths: ['docs/**', '**.md']

permissions:
  contents: read

jobs:
  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public documentation boundary
        run: python scripts/check_public_docs.py
